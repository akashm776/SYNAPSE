name: CPU science checks
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/check_research_docs.py
      - run: python -m pip install torch==2.9.1 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -e '.[llm,test]'
      - run: python -m pytest -q
      - run: synapse preflight --config configs/llm_smoke.json --output runs/smoke
      - run: synapse run --config configs/llm_smoke.json --output runs/smoke
      - run: synapse report --config configs/llm_smoke.json --output runs/smoke
      - run: synapse-audit --source runs/smoke --output runs/audit_smoke --config configs/audit_smoke.json
      - run: synapse-learnability --source runs/smoke --output runs/learnability_smoke --config configs/learnability_smoke.json
      - run: synapse-strength --source runs/smoke --output runs/strength_smoke --config configs/strength_smoke.json
