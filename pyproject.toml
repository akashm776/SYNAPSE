[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "synapse-research"
version = "0.1.0"
description = "State-dependent synthetic supervision for language models"
requires-python = ">=3.10"
dependencies = ["torch>=2.5", "numpy>=1.26"]

[project.optional-dependencies]
llm = ["transformers==4.57.3", "datasets==2.21.0", "accelerate>=1.2,<2"]
test = ["pytest>=8"]

[project.scripts]
synapse = "synapse.llm.cli:main"
synapse-audit = "synapse.audit:main"
synapse-learnability = "synapse.learnability:main"
synapse-strength = "synapse.strength:main"
synapse-fresh-strength = "synapse.fresh_strength:main"

[tool.setuptools.packages.find]
include = ["synapse*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
